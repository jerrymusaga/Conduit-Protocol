name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual trigger for the fork-test job

jobs:
  # -------------------------------------------------------------------------
  # Unit tests + build. Runs on every push / PR. Fast (~1 min).
  # No RPC needed; pure local EVM.
  # -------------------------------------------------------------------------
  build-and-unit-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies (pinned)
        run: |
          forge install foundry-rs/forge-std --no-commit --no-git
          forge install MetaMask/delegation-framework@v1.3.0 --no-commit --no-git
          forge install erc7579/erc7579-implementation@v0.0.2 --no-commit --no-git
          forge install eth-infinitism/account-abstraction@v0.7.0 --no-commit --no-git

      - name: Build
        run: forge build --sizes

      - name: Unit tests
        run: forge test --match-contract X402ReceiptEnforcerTest -vvv

  # -------------------------------------------------------------------------
  # Fork integration test. Run on workflow_dispatch (manual) only — public
  # RPCs rate-limit aggressively and we don't want every PR to flake.
  # When you have a paid RPC URL, switch this to also run on push / PR.
  # -------------------------------------------------------------------------
  fork-test:
    name: fork integration test (Base Sepolia)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies (pinned)
        run: |
          forge install foundry-rs/forge-std --no-commit --no-git
          forge install MetaMask/delegation-framework@v1.3.0 --no-commit --no-git
          forge install erc7579/erc7579-implementation@v0.0.2 --no-commit --no-git
          forge install eth-infinitism/account-abstraction@v0.7.0 --no-commit --no-git

      - name: Fork test
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
        run: |
          forge test \
            --fork-url $BASE_SEPOLIA_RPC_URL \
            --match-contract X402ReceiptEnforcerForkTest \
            -vvv

  # -------------------------------------------------------------------------
  # Formatting check. Catches drift in code style.
  # -------------------------------------------------------------------------
  fmt:
    name: forge fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check formatting
        run: forge fmt --check
